# Reusable build + XCTest job for an app repository.
name: Test

on:
  workflow_call:
    inputs:
      scheme:
        type: string
        required: true
      runner:
        type: string
        default: macos-26
      xcode-path:
        description: Optional Xcode.app path; the runner default is used when empty.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  xctest:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: inputs.xcode-path != ''
        run: sudo xcode-select -s "${{ inputs.xcode-path }}"

      - name: Build and test
        env:
          SCHEME: ${{ inputs.scheme }}
        run: |
          xcodebuild -version
          xcodebuild test -quiet -scheme "$SCHEME" -destination 'platform=macOS,arch=arm64'
