# Reusable SwiftLint job. Uses the caller repository's .swiftlint.yml.
name: Lint

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: macos-26
      swiftlint-version:
        type: string
        default: 0.65.1
      swiftlint-sha256:
        type: string
        default: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint ${{ inputs.swiftlint-version }}
        env:
          VERSION: ${{ inputs.swiftlint-version }}
          SHA256: ${{ inputs.swiftlint-sha256 }}
        run: |
          zip="$RUNNER_TEMP/swiftlint.zip"
          curl -fsSL -o "$zip" "https://github.com/realm/SwiftLint/releases/download/$VERSION/portable_swiftlint.zip"
          echo "$SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
